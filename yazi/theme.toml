[manager]
cwd            = { fg = "#2EC09C" }

hovered        = { fg = "#0B3335", bg = "#2EC09C" }
preview_hovered = { underline = true }

find_keyword   = { fg = "#5EEAD4", italic = true }
find_position  = { fg = "#2EC09C", bg = "reset", bold = true }

marker_copied  = { fg = "#5EEAD4", bg = "#5EEAD4" }
marker_cut     = { fg = "#E06C75", bg = "#E06C75" }
marker_marked  = { fg = "#2EC09C", bg = "#2EC09C" }
marker_selected = { fg = "#D1B897", bg = "#D1B897" }

tab_active     = { fg = "#0B3335", bg = "#2EC09C" }
tab_inactive   = { fg = "#E8ECDF", bg = "#0B3335" }

count_copied   = { fg = "#0B3335", bg = "#5EEAD4" }
count_cut      = { fg = "#0B3335", bg = "#E06C75" }
count_selected = { fg = "#0B3335", bg = "#D1B897" }

border_symbol = "│"
border_style  = { fg = "#1B4A4D" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#0B3335", bg = "#0B3335" }

mode_normal_main = { fg = "#0B3335", bg = "#2EC09C", bold = true }
mode_normal_alt  = { fg = "#2EC09C", bg = "#092328" }
mode_select_main = { fg = "#0B3335", bg = "#D1B897", bold = true }
mode_select_alt  = { fg = "#D1B897", bg = "#092328" }
mode_unset_main  = { fg = "#0B3335", bg = "#E06C75", bold = true }
mode_unset_alt   = { fg = "#E06C75", bg = "#092328" }

progress_label  = { fg = "#E8ECDF", bold = true }
progress_normal = { fg = "#2EC09C", bg = "#092328" }
progress_error  = { fg = "#E06C75", bg = "#092328" }

permissions_t = { fg = "#2EC09C" }
permissions_r = { fg = "#D1B897" }
permissions_w = { fg = "#E06C75" }
permissions_x = { fg = "#5EEAD4" }
permissions_s = { fg = "#6E8E8A" }

[input]
border   = { fg = "#2EC09C" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#2EC09C" }
active   = { fg = "#5EEAD4" }
inactive = {}

[tasks]
border  = { fg = "#2EC09C" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#0B3335" }
cand            = { fg = "#5EEAD4" }
rest            = { fg = "#6E8E8A" }
desc            = { fg = "#2EC09C" }
separator       = "  "
separator_style = { fg = "#1B4A4D" }

[help]
on      = { fg = "#5EEAD4" }
run     = { fg = "#D1B897" }
desc    = { fg = "#E8ECDF" }
hovered = { bg = "#2EC09C", bold = true }
footer  = { fg = "#0B3335", bg = "#E8ECDF" }

[filetype]
rules = [
  { mime = "inode/directory", fg = "#2EC09C" },
  { mime = "image/*", fg = "#5EEAD4" },
  { mime = "video/*", fg = "#D1B897" },
  { mime = "audio/*", fg = "#D1B897" },
  { mime = "application/zip", fg = "#E06C75" },
  { mime = "application/*zip", fg = "#E06C75" },
  { mime = "application/x-tar", fg = "#E06C75" },
  { mime = "application/x-bzip*", fg = "#E06C75" },
  { mime = "application/x-7z-compressed", fg = "#E06C75" },
  { mime = "application/x-rar", fg = "#E06C75" },
  { mime = "*", fg = "#E8ECDF" },
]
